# Test-only pipeline for validating the Python 3.14 upgrade of iotedgehubdev.
#
# This is a TRIMMED version of vsts_ci/azure-pipelines.yml that keeps ONLY the
# test jobs (tox -e py314). The publish/sign/upload jobs and the 1ES self-hosted
# pools, ESRP signing, and azuresdkpartnerdrops service connection from the full
# pipeline are intentionally removed because they require Microsoft-internal
# resources that do not exist in a personal/standalone Azure DevOps org.
#
# It must live in vsts_ci/ so the `- template: <os>/...` paths resolve.
#
# Required pipeline variables (Pipeline -> Edit -> Variables, mark secrets as secret):
#   IOTHUB_CONNECTION_STRING        HostName=<hub>.azure-devices.net;SharedAccessKeyName=iothubowner;SharedAccessKey=...
#   LINUX_DEVICE_CONNECTION_STRING  HostName=<hub>.azure-devices.net;DeviceId=<edge-device>;SharedAccessKey=...
#   WINDOWS_DEVICE_CONNECTION_STRING  (same value as LINUX_, only needed if you keep the Windows job)
#   DARWIN_DEVICE_CONNECTION_STRING   (same value, only needed if you keep the macOS job)
#   CONTAINER_REGISTRY_SERVER       <registry>.azurecr.io
#   CONTAINER_REGISTRY_USERNAME     <acr-username>
#   CONTAINER_REGISTRY_PASSWORD     <acr-password>   (secret)
#   TEST_CA_KEY_PASSPHASE           any non-empty string (secret)
#
# NOTE: to get the ~12 device-auth integration tests GREEN, the hub must be
# SAS-enabled (disableLocalAuth=false) with a real edge device. Against a
# disableLocalAuth=true hub expect ~179 pass / ~12 fail (401002).
#
# NOTE: the simulator/compose tests need a LINUX Docker daemon. Microsoft-hosted
# ubuntu agents provide this. macOS-hosted agents have NO Docker daemon and the
# Windows-hosted agent runs Windows containers, so the Linux job is the
# authoritative one for the container/simulator tests.

trigger: none      # run manually from the Azure DevOps website

jobs:
  - job: Linux
    pool:
      vmImage: ubuntu-22.04
    strategy:
      matrix:
        Python314:
          python.version: "3.14"
          TOXENV: "py314"
      maxParallel: 1
    steps:
      # DIAG (Brian's ask): capture the agent's Docker engine + the Python docker
      # SDK the tests resolve, so we can compare green(Linux) vs red(Windows) and
      # what the test needs vs what the agent provides. Read-only; never fails the job.
      - bash: |
          set +e
          echo '=== docker version (client + server) ==='
          docker version
          echo '=== docker info (key fields) ==='
          docker info --format 'OSType={{.OSType}} ServerVersion={{.ServerVersion}} Isolation={{.Isolation}} Experimental={{.ExperimentalBuild}}'
          echo '=== docker SDK pin in requirements.txt ==='
          grep -i '^docker' requirements.txt
          echo '=== resolved Python docker SDK version ==='
          python -m pip install --quiet --disable-pip-version-check 'docker>=7.1.0'
          python -c "import docker; print('resolved docker SDK =', docker.__version__)"
        displayName: "DIAG: docker engine + Python SDK versions"
        continueOnError: true

      - template: linux/continuous-build-linux.yml

  - job: Windows
    pool:
      vmImage: windows-2022
    strategy:
      matrix:
        Python314:
          python.version: "3.14"
          TOXENV: "py314"
      maxParallel: 1
    steps:
      # DIAG (Brian's ask): capture the agent's Docker engine + the Python docker
      # SDK the tests resolve, so we can compare against the Linux leg and see what
      # the test needs vs what the agent provides. Read-only; never fails the job.
      - powershell: |
          $ErrorActionPreference = 'Continue'
          Write-Host '=== docker version (client + server) ==='
          docker version
          Write-Host '=== docker info (key fields) ==='
          docker info --format 'OSType={{.OSType}} ServerVersion={{.ServerVersion}} Isolation={{.Isolation}} Experimental={{.ExperimentalBuild}}'
          Write-Host '=== docker SDK pin in requirements.txt ==='
          Select-String -Path requirements.txt -Pattern '^docker'
          Write-Host '=== resolved Python docker SDK version ==='
          python -m pip install --quiet --disable-pip-version-check 'docker>=7.1.0'
          python -c "import docker; print('resolved docker SDK =', docker.__version__)"
        displayName: "DIAG: docker engine + Python SDK versions"
        continueOnError: true

      # DIAGNOSTIC PROBE (temporary): determine whether this hosted windows-2022
      # agent can be put into Linux-container mode. In 2022 the equivalent agent
      # was somehow able to run the Linux int-test image; the mechanism was never
      # captured in the old logs, so this probe checks the current agent directly.
      # This step reports the daemon OSType, whether a Docker Desktop switch tool
      # (DockerCli.exe) is even present, attempts the switch if it is, and tries to
      # pull+run a tiny Linux image. Read the log:
      #   - final OSType 'linux' AND the alpine run succeeds  -> Option B is feasible
      #   - OSType stays 'windows' / no DockerCli.exe / pull fails -> Option B is NOT
      #     feasible on this agent; use Option A (skip test_create on Windows daemon)
      - powershell: |
          $ErrorActionPreference = 'Continue'
          Write-Host '=== docker version ==='
          docker version
          Write-Host '=== initial daemon OSType ==='
          $before = (docker info --format '{{.OSType}}') 2>&1
          Write-Host "OSType(before) = $before"
          Write-Host '=== look for Docker Desktop switch tool (DockerCli.exe) ==='
          $cli = Join-Path $env:ProgramFiles 'Docker\Docker\DockerCli.exe'
          if (Test-Path $cli) {
            Write-Host "Found: $cli -- attempting -SwitchLinuxEngine"
            & $cli -SwitchLinuxEngine
            Start-Sleep -Seconds 10
          } else {
            Write-Host "NOT FOUND: $cli  (hosted agents run Docker EE/moby, no Desktop switch tool)"
          }
          Write-Host '=== daemon OSType after switch attempt ==='
          $after = (docker info --format '{{.OSType}}') 2>&1
          Write-Host "OSType(after) = $after"
          Write-Host '=== try to pull+run a tiny Linux image ==='
          docker pull alpine:3.19
          docker run --rm alpine:3.19 uname -a
          Write-Host "=== PROBE SUMMARY: OSType(before)=$before OSType(after)=$after ==="
        displayName: "PROBE: can this Windows agent run Linux containers?"
        continueOnError: true

      - template: win32/continuous-build-win32.yml

  - job: MacOS
    pool:
      vmImage: macOS-latest
    strategy:
      matrix:
        Python314:
          python.version: "3.14"
          TOXENV: "py314"
      maxParallel: 1
    steps:
      - template: darwin/continuous-build-darwin.yml
